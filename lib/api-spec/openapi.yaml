components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    OpportunityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    OpportunitySlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 100
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    OpportunityOptionId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Conflicting state or duplicate slug
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Subscription storage is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    DevelopmentSignInInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: ["string", "null"]
    PublicSubscriptionInput:
      type: object
      additionalProperties: false
      required: [email, consent, name]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        consent:
          type: boolean
          const: true
        existingManagementToken:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Accepted for compatibility with previously issued private links. It is
            ignored by this endpoint and never changes or reveals a subscription.
        name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ".*\\S.*"
        craft:
          type: string
          maxLength: 120
        careerLevel:
          $ref: "#/components/schemas/CareerLevel"
        location:
          type: string
          maxLength: 160
        acquisitionSource:
          type: string
          maxLength: 120
          enum: [instagram, linkedin, whatsapp_group, facebook_group, industry_network, recommendation, other]
        acquisitionDetail:
          type: string
          maxLength: 500
        acquisitionDetailDeclined:
          type: boolean
        interests:
          type: array
          items: { type: string, maxLength: 120 }
        contentTypes:
          type: array
          items: { $ref: "#/components/schemas/AudienceContentType" }
        careerLevels:
          type: array
          items: { $ref: "#/components/schemas/CareerLevel" }
        crafts:
          type: array
          items: { type: string, maxLength: 120 }
        allOpportunities:
          type: boolean
    PublicSubscriptionUnsubscribeInput:
      type: object
      additionalProperties: false
      required: [managementToken]
      properties:
        managementToken:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
    PublicSubscriptionMessage:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    OpportunityStatus:
      type: string
      enum: [draft, published, closed, filled, archived]
    ProgrammeStatus:
      type: string
      enum: [draft, published, closed, archived]
    ProgrammeSection:
      type: object
      required: [id, section, position, content]
      properties:
        id: { type: string, format: uuid }
        section:
          type: string
          enum: [about, placement, training, eligibility, timeline, application_guidance]
        position: { type: integer, minimum: 0 }
        content: { type: string }
    Programme:
      type: object
      required: [id, slug, num, cardTitle, cardCopy, cardCta, image, title, shortDescription, status, applicationStatus, location, featured, displayOrder, sections, createdAt, updatedAt, createdBy, updatedBy]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, minLength: 2, maxLength: 100, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        num: { type: string, minLength: 1, maxLength: 10 }
        cardTitle: { type: string, minLength: 2, maxLength: 160 }
        cardCopy: { type: string, minLength: 1, maxLength: 2000 }
        cardCta: { type: string, minLength: 1, maxLength: 100 }
        image: { type: string, minLength: 1, maxLength: 500 }
        title: { type: string, minLength: 2, maxLength: 160 }
        shortDescription: { type: string, minLength: 1, maxLength: 4000 }
        status: { $ref: "#/components/schemas/ProgrammeStatus" }
        applicationStatus: { type: string }
        applicationDeadline: { type: ["string", "null"] }
        deadline: { type: ["string", "null"], format: date-time }
        location: { type: string }
        applicationUrl: { type: ["string", "null"], format: uri }
        featured: { type: boolean }
        displayOrder: { type: integer }
        sections: { type: array, items: { $ref: "#/components/schemas/ProgrammeSection" } }
        publishedAt: { type: ["string", "null"], format: date-time }
        archivedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedBy: { type: string }
    PublicProgramme:
      type: object
      required: [id, slug, num, cardTitle, cardCopy, cardCta, image, title, shortDescription, status, applicationStatus, location, featured, displayOrder, about, placement, training, eligibility, timeline, applicationGuidance]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        num: { type: string }
        cardTitle: { type: string }
        cardCopy: { type: string }
        cardCta: { type: string }
        image: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        status: { $ref: "#/components/schemas/ProgrammeStatus" }
        applicationStatus: { type: string, minLength: 1, maxLength: 100 }
        location: { type: string, minLength: 1, maxLength: 500 }
        applicationUrl: { type: ["string", "null"], format: uri }
        applicationDeadline: { type: ["string", "null"] }
        deadline: { type: ["string", "null"], format: date-time }
        featured: { type: boolean }
        displayOrder: { type: integer }
        about: { type: array, items: { type: string } }
        placement: { type: array, items: { type: string } }
        training: { type: array, items: { type: string } }
        eligibility: { type: array, items: { type: string } }
        timeline: { type: array, items: { type: string } }
        applicationGuidance: { type: array, items: { type: string } }
    ProgrammeInput:
      type: object
      required: [slug, num, cardTitle, cardCopy, cardCta, image, title, shortDescription, applicationStatus, location, featured, displayOrder, sections]
      properties:
        slug: { type: string, minLength: 2, maxLength: 100, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        num: { type: string, minLength: 1, maxLength: 10 }
        cardTitle: { type: string, minLength: 2, maxLength: 160 }
        cardCopy: { type: string, minLength: 1, maxLength: 2000 }
        cardCta: { type: string, minLength: 1, maxLength: 100 }
        image: { type: string, minLength: 1, maxLength: 500 }
        title: { type: string, minLength: 2, maxLength: 160 }
        shortDescription: { type: string, minLength: 1, maxLength: 4000 }
        applicationStatus: { type: string, minLength: 1, maxLength: 100 }
        applicationDeadline: { type: ["string", "null"] }
        deadline: { type: ["string", "null"], format: date-time }
        location: { type: string, minLength: 1, maxLength: 500 }
        applicationUrl: { type: ["string", "null"], format: uri }
        featured: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
        sections: { type: array, items: { $ref: "#/components/schemas/ProgrammeSectionInput" } }
    ProgrammeSectionInput:
      type: object
      required: [section, position, content]
      properties:
        section: { type: string, enum: [about, placement, training, eligibility, timeline, application_guidance] }
        position: { type: integer, minimum: 0 }
        content: { type: string }
    ProgrammePage:
      type: object
      required: [items, page, pageSize, total, pageCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Programme" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    ProgrammeAuditEvents:
      type: array
      items:
        $ref: "#/components/schemas/AuditEvent"
    ProgrammeTransition:
      type: object
      required: [status]
      properties:
                status: { type: string, enum: [draft, published, closed, archived] }
    PublicOpportunityStatus:
      type: string
      enum: [Open, Closed, Filled]
    PortalRole:
      type: string
      enum: [super_admin, opportunity_manager, viewer]
    OpportunityOptionKind:
      type: string
      enum: [department, role_type]
    OpportunityOption:
      type: object
      required: [id, kind, label, active, retiredAt, createdAt]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/OpportunityOptionKind"
        label:
          type: string
        active:
          type: boolean
        retiredAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    OpportunityOptions:
      type: object
      required: [departments, roleTypes]
      properties:
        departments:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityOption"
        roleTypes:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityOption"
    PublicOpportunityOptions:
      type: object
      additionalProperties: false
      required: [departments, roleTypes]
      properties:
        departments:
          type: array
          items:
            type: string
        roleTypes:
          type: array
          items:
            type: string
    OpportunityOptionInput:
      type: object
      additionalProperties: false
      required: [kind, label]
      properties:
        kind:
          $ref: "#/components/schemas/OpportunityOptionKind"
        label:
          type: string
          minLength: 2
          maxLength: 100
    OpportunityOptionRename:
      type: object
      additionalProperties: false
      required: [label]
      properties:
