openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: Shared contract for Larkin2 public opportunities and the internal management portal.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public-opportunities
  - name: portal-session
  - name: portal-dashboard
  - name: portal-opportunities
  - name: portal-opportunity-options
  - name: portal-members
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/opportunities:
    get:
      operationId: listPublicOpportunities
      tags: [public-opportunities]
      summary: List opportunities eligible for public display
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Public opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicOpportunity"
  /public/opportunities/{slug}:
    get:
      operationId: getPublicOpportunity
      tags: [public-opportunities]
      summary: Get one publicly visible opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunitySlug"
      responses:
        "200":
          description: Public opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOpportunity"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/session:
    get:
      operationId: getPortalSession
      tags: [portal-session]
      summary: Get the authenticated user's portal membership and permissions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Portal session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      tags: [portal-dashboard]
      summary: Get opportunity totals and recent activity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portal/opportunity-options:
    get:
      operationId: listPortalOpportunityOptions
      tags: [portal-opportunity-options]
      summary: List selectable departments and role types
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: includeRetired
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Managed opportunity options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Add a selectable department or role type
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityOptionInput"
      responses:
        "201":
          description: Created opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunity-options/{id}:
    patch:
      operationId: renamePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Rename a department or role type without changing historical opportunities
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityOptionRename"
      responses:
        "200":
          description: Renamed opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunity-options/{id}/retire:
    post:
      operationId: retirePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Retire a department or role type from future selection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      responses:
        "200":
          description: Retired opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/opportunity-options/{id}/restore:
    post:
      operationId: restorePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Restore a retired department or role type for future selection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      responses:
        "200":
          description: Restored opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunity-options/{id}/merge:
    post:
      operationId: mergePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Merge an option into an active option of the same kind while preserving historical labels
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityOptionMerge"
      responses:
        "200":
          description: Merged and retired source option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/opportunities:
    get:
      operationId: listPortalOpportunities
      tags: [portal-opportunities]
      summary: Search and paginate all internal opportunities
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OpportunityStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: sort
          schema:
            type: string
            enum: [updatedAt, title, department, deadline, status]
            default: updatedAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPortalOpportunity
      tags: [portal-opportunities]
      summary: Create a draft opportunity
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunities/{id}:
    get:
      operationId: getPortalOpportunity
      tags: [portal-opportunities]
      summary: Get an internal opportunity
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePortalOpportunity
      tags: [portal-opportunities]
      summary: Update opportunity content
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePortalOpportunity
      tags: [portal-opportunities]
      summary: Permanently delete an archived opportunity
      description: Super Admin only. Normal removal should use the Archived lifecycle state.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityDeleteConfirmation"
      responses:
        "204":
          description: Permanently deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/opportunities/{id}/transition:
    post:
      operationId: transitionPortalOpportunity
      tags: [portal-opportunities]
      summary: Change an opportunity lifecycle state
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityTransition"
      responses:
        "200":
          description: Transitioned opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunities/{id}/audit:
    get:
      operationId: listOpportunityAuditEvents
      tags: [portal-opportunities]
      summary: List the audit trail for an opportunity
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/members:
    get:
      operationId: listPortalMembers
      tags: [portal-members]
      summary: List portal memberships
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Portal members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portal/members/{userId}:
    patch:
      operationId: updatePortalMember
      tags: [portal-members]
      summary: Approve, suspend, or change a portal member role
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalMemberUpdate"
      responses:
        "200":
          description: Updated portal member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    OpportunityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    OpportunitySlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 100
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    OpportunityOptionId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Conflicting state or duplicate slug
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: ["string", "null"]
    OpportunityStatus:
      type: string
      enum: [draft, published, closed, filled, archived]
    PublicOpportunityStatus:
      type: string
      enum: [Open, Closed, Filled]
    PortalRole:
      type: string
      enum: [super_admin, opportunity_manager, viewer]
    OpportunityOptionKind:
      type: string
      enum: [department, role_type]
    OpportunityOption:
      type: object
      required: [id, kind, label, active, retiredAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/OpportunityOptionKind"
        label:
          type: string
        active:
          type: boolean
        retiredAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    OpportunityOptions:
      type: object
      required: [departments, roleTypes]
      properties:
        departments:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityOption"
        roleTypes:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityOption"
    OpportunityOptionInput:
      type: object
      additionalProperties: false
      required: [kind, label]
      properties:
        kind:
          $ref: "#/components/schemas/OpportunityOptionKind"
        label:
          type: string
          minLength: 2
          maxLength: 100
    OpportunityOptionRename:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 2
          maxLength: 100
    OpportunityOptionMerge:
      type: object
      additionalProperties: false
      required: [targetId]
      properties:
        targetId:
          type: string
          format: uuid
    OpportunityContentItem:
      type: object
      required: [id, section, position, content]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          enum: [responsibility, essential, desired]
        position:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
          maxLength: 1000
    OpportunityContentItemInput:
      type: object
      required: [section, position, content]
      properties:
        section:
          type: string
          enum: [responsibility, essential, desired]
        position:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
          maxLength: 1000
    OpportunityDetail:
      type: object
      required: [id, position, label, value]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        label:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: string
          minLength: 1
          maxLength: 2000
    OpportunityDetailInput:
      type: object
      required: [position, label, value]
      properties:
        position:
          type: integer
          minimum: 0
        label:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: string
          minLength: 1
          maxLength: 2000
    PublicOpportunity:
      type: object
      required:
        - id
        - slug
        - title
        - status
        - publicationLabel
        - department
        - roleType
        - summary
        - responsibilities
        - details
        - applicationDeadline
        - deadlineExtended
        - featured
        - urgent
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/PublicOpportunityStatus"
        publicationLabel:
          type: string
        department:
          type: string
        roleType:
          type: string
        summary:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        essential:
          type: array
          items:
            type: string
        desired:
          type: array
          items:
            type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityDetail"
        applicationDeadline:
          type: string
        responseDate:
          type: ["string", "null"]
        applicationUrl:
          type: ["string", "null"]
          format: uri
        deadline:
          type: ["string", "null"]
          format: date-time
        deadlineExtended:
          type: boolean
        featured:
          type: boolean
        urgent:
          type: boolean
    Opportunity:
      type: object
      required:
        - id
        - slug
        - title
        - status
        - publicationLabel
        - department
        - roleType
        - summary
        - applicationDeadline
        - deadlineExtended
        - featured
        - urgent
        - contentItems
        - details
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/OpportunityStatus"
        publicationLabel:
          type: string
        department:
          type: string
        roleType:
          type: string
        summary:
          type: string
        applicationDeadline:
          type: string
        responseDate:
          type: ["string", "null"]
        applicationUrl:
          type: ["string", "null"]
          format: uri
        deadline:
          type: ["string", "null"]
          format: date-time
        deadlineExtended:
          type: boolean
        featured:
          type: boolean
        urgent:
          type: boolean
        contentItems:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityContentItem"
        details:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityDetail"
        publishedAt:
          type: ["string", "null"]
          format: date-time
        archivedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    OpportunityInput:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - publicationLabel
        - department
        - roleType
        - summary
        - applicationDeadline
        - deadlineExtended
        - featured
        - urgent
        - contentItems
        - details
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          minLength: 2
          maxLength: 160
        publicationLabel:
          type: string
          minLength: 2
          maxLength: 100
        department:
          type: string
          minLength: 2
          maxLength: 100
        roleType:
          type: string
          minLength: 2
          maxLength: 100
        summary:
          type: string
          minLength: 20
          maxLength: 2000
        applicationDeadline:
          type: string
          minLength: 2
          maxLength: 500
        responseDate:
          type: ["string", "null"]
          maxLength: 500
        applicationUrl:
          type: ["string", "null"]
          format: uri
          maxLength: 2000
        deadline:
          type: ["string", "null"]
          format: date-time
        deadlineExtended:
          type: boolean
        featured:
          type: boolean
        urgent:
          type: boolean
        contentItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OpportunityContentItemInput"
        details:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OpportunityDetailInput"
    OpportunityTransition:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OpportunityStatus"
    OpportunityDeleteConfirmation:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          enum: [DELETE]
    OpportunityPage:
      type: object
      required: [items, page, pageSize, total, pageCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pageCount:
          type: integer
          minimum: 0
    DashboardCounts:
      type: object
      required: [total, draft, published, closingSoon, closed, filled, archived]
      properties:
        total:
          type: integer
        draft:
          type: integer
        published:
          type: integer
        closingSoon:
          type: integer
        closed:
          type: integer
        filled:
          type: integer
        archived:
          type: integer
    AuditEvent:
      type: object
      required: [id, action, actorUserId, actorName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        opportunityId:
          type: ["string", "null"]
          format: uuid
        action:
          type: string
        actorUserId:
          type: string
        actorName:
          type: string
        beforeState:
          type: ["object", "null"]
          additionalProperties: true
        afterState:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    PortalDashboard:
      type: object
      required: [counts, recentOpportunities, recentActivity]
      properties:
        counts:
          $ref: "#/components/schemas/DashboardCounts"
        recentOpportunities:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    PortalMember:
      type: object
      required: [userId, displayName, email, role, active, createdAt, updatedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/PortalRole"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PortalMemberUpdate:
      type: object
      additionalProperties: false
      required: [role, active]
      properties:
        role:
          $ref: "#/components/schemas/PortalRole"
        active:
          type: boolean
    PortalSession:
      type: object
      required: [member, permissions]
      properties:
        member:
          $ref: "#/components/schemas/PortalMember"
        permissions:
          type: array
          items:
            type: string
            enum:
              - opportunities:read
              - opportunities:write
              - opportunities:publish
              - opportunities:delete
              - opportunity-options:manage
              - opportunity-options:lifecycle
              - members:manage