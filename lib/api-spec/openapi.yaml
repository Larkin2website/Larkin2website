openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: Shared contract for Larkin2 public opportunities and the internal management portal.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public-subscriptions
  - name: public-opportunities
  - name: portal-session
  - name: portal-dashboard
  - name: portal-opportunities
  - name: portal-opportunity-options
  - name: portal-members
  - name: public-programmes
  - name: portal-programmes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/opportunities:
    get:
      operationId: listPublicOpportunities
      tags: [public-opportunities]
      summary: List opportunities eligible for public display
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Public opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicOpportunity"
  /public/opportunity-options:
    get:
      operationId: listPublicOpportunityOptions
      tags: [public-opportunities]
      summary: List active opportunity options for public filters
      responses:
        "200":
          description: Active public opportunity option labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOpportunityOptions"
  /public/subscriptions:
    post:
      operationId: createPublicSubscription
      tags: [public-subscriptions]
      summary: Subscribe an email address to opportunity updates
      description: >-
        Records explicit consent and optional preferences for a new subscription.
        A nonblank name is required. New and duplicate requests receive the same
        generic response. Duplicate requests never disclose or modify an existing
        subscription, even when a previously issued management token is supplied.
        This endpoint never issues or returns a management token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSubscriptionInput"
      responses:
        "200":
          description: Generic response that does not disclose subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubscriptionMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /public/subscriptions/unsubscribe:
    post:
      operationId: unsubscribePublicSubscription
      tags: [public-subscriptions]
      summary: Stop updates using a personal management token
      description: >-
        Idempotently deactivates only the subscription represented by the supplied
        personal token. The response does not reveal whether the token matched.
        This action is POST-only; no GET request mutates subscription state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSubscriptionUnsubscribeInput"
      responses:
        "200":
          description: Uniform unsubscribe response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubscriptionMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /public/subscriptions/code:
    post:
      operationId: requestSubscriptionCode
      tags: [public-subscriptions]
      summary: Request a verification-only email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCodeRequest"
      responses:
        "200":
          description: Neutral response regardless of subscriber status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubscriptionMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /public/subscriptions/code/verify:
    post:
      operationId: verifySubscriptionCode
      tags: [public-subscriptions]
      summary: Exchange a one-time email code for short-lived management access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCodeVerification"
      responses:
        "200":
          description: Verified access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /public/subscriptions/verified/preferences:
    post:
      operationId: getVerifiedSubscriptionPreferences
      tags: [public-subscriptions]
      summary: Read preferences with short-lived verified access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionAccessInput"
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAudiencePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateVerifiedSubscriptionPreferences
      tags: [public-subscriptions]
      summary: Update preferences with short-lived verified access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiedAudiencePreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAudiencePreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /public/subscriptions/verified/unsubscribe:
    post:
      operationId: unsubscribeVerifiedSubscription
      tags: [public-subscriptions]
      summary: Unsubscribe with short-lived verified access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionAccessInput"
      responses:
        "200":
          description: Subscription stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubscriptionMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /public/opportunities/{slug}:
    get:
      operationId: getPublicOpportunity
      tags: [public-opportunities]
      summary: Get one publicly visible opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunitySlug"
      responses:
        "200":
          description: Public opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOpportunity"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/session:
    get:
      operationId: getPortalSession
      tags: [portal-session]
      summary: Get the authenticated user's portal membership and permissions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Portal session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portal/demo-session:
    post:
      operationId: createPortalDemoSession
      tags: [portal-session]
      summary: Start a temporary portal testing session
      description: |
        Available only when temporary test sign-in is explicitly enabled for the
        current environment. Any valid email and non-empty password are accepted;
        these credentials do not verify identity. The session grants full portal
        testing access and must not be used for secure staff authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentSignInInput"
      responses:
        "204":
          description: Demo session started
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePortalDemoSession
      tags: [portal-session]
      summary: End the browser-scoped demo portal session
      responses:
        "204":
          description: Demo session ended
  /crm/demo-session:
    post:
      operationId: createCrmDemoSession
      tags: [crm]
      summary: Start a temporary CRM testing session
      description: |
        Available only when temporary test sign-in is explicitly enabled for the
        current environment. Any valid email and non-empty password are accepted;
        these credentials do not verify identity. The session grants full CRM
        testing access and must not be used for secure staff authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentSignInInput"
      responses:
        "204":
          description: CRM testing session started
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCrmDemoSession
      tags: [crm]
      summary: End a temporary CRM testing session
      responses:
        "204":
          description: CRM testing session ended
  /portal/access-grants:
    post:
      operationId: createPortalAccessGrant
      tags: [portal-members]
      summary: Pre-grant portal access by name, email, and role
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalAccessGrantInput"
      responses:
        "201":
          description: Access grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      tags: [portal-dashboard]
      summary: Get opportunity totals and recent activity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portal/opportunity-options:
    get:
      operationId: listPortalOpportunityOptions
      tags: [portal-opportunity-options]
      summary: List selectable departments and role types
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: includeRetired
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Managed opportunity options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Add a selectable department or role type
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityOptionInput"
      responses:
        "201":
          description: Created opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunity-options/{id}:
    patch:
      operationId: renamePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Rename a department or role type without changing historical opportunities
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityOptionRename"
      responses:
        "200":
          description: Renamed opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunity-options/{id}/retire:
    post:
      operationId: retirePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Retire a department or role type from future selection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      responses:
        "200":
          description: Retired opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/opportunity-options/{id}/restore:
    post:
      operationId: restorePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Restore a retired department or role type for future selection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      responses:
        "200":
          description: Restored opportunity option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunity-options/{id}/merge:
    post:
      operationId: mergePortalOpportunityOption
      tags: [portal-opportunity-options]
      summary: Merge an option into an active option of the same kind while preserving historical labels
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityOptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityOptionMerge"
      responses:
        "200":
          description: Merged and retired source option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/opportunities:
    get:
      operationId: listPortalOpportunities
      tags: [portal-opportunities]
      summary: Search and paginate all internal opportunities
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OpportunityStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: sort
          schema:
            type: string
            enum: [updatedAt, title, department, deadline, status]
            default: updatedAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPortalOpportunity
      tags: [portal-opportunities]
      summary: Create a draft opportunity
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunities/{id}:
    get:
      operationId: getPortalOpportunity
      tags: [portal-opportunities]
      summary: Get an internal opportunity
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePortalOpportunity
      tags: [portal-opportunities]
      summary: Update opportunity content
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePortalOpportunity
      tags: [portal-opportunities]
      summary: Permanently delete an archived opportunity
      description: Super Admin only. Normal removal should use the Archived lifecycle state.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityDeleteConfirmation"
      responses:
        "204":
          description: Permanently deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/opportunities/{id}/transition:
    post:
      operationId: transitionPortalOpportunity
      tags: [portal-opportunities]
      summary: Change an opportunity lifecycle state
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityTransition"
      responses:
        "200":
          description: Transitioned opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /portal/opportunities/{id}/audit:
    get:
      operationId: listOpportunityAuditEvents
      tags: [portal-opportunities]
      summary: List the audit trail for an opportunity
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/programmes:
    get:
      operationId: listPublicProgrammes
      tags: [public-programmes]
      summary: List published programmes
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Public programmes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PublicProgramme" } }
  /public/programmes/{slug}:
    get:
      operationId: getPublicProgramme
      tags: [public-programmes]
      summary: Get a published programme
      parameters:
        - $ref: "#/components/parameters/OpportunitySlug"
      responses:
        "200":
          description: Public programme
          content:
            application/json: { schema: { $ref: "#/components/schemas/PublicProgramme" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/programmes:
    get:
      operationId: listPortalProgrammes
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ProgrammeStatus" } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: sort, schema: { type: string, enum: [updatedAt, title, displayOrder, status], default: updatedAt } }
        - { in: query, name: order, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: Programme page
          content:
            application/json: { schema: { $ref: "#/components/schemas/ProgrammePage" } }
    post:
      operationId: createPortalProgramme
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgrammeInput" } } }
      responses:
        "201":
          description: Created programme
          content: { application/json: { schema: { $ref: "#/components/schemas/Programme" } } }
  /portal/programmes/{id}:
    get:
      operationId: getPortalProgramme
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
      responses:
        "200": { description: Programme, content: { application/json: { schema: { $ref: "#/components/schemas/Programme" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePortalProgramme
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgrammeInput" } } }
      responses:
        "200": { description: Updated programme, content: { application/json: { schema: { $ref: "#/components/schemas/Programme" } } } }
    delete:
      operationId: deletePortalProgramme
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
      responses: { "204": { description: Permanently deleted } }
  /portal/programmes/{id}/transition:
    post:
      operationId: transitionPortalProgramme
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProgrammeTransition" } }
      responses:
        "200": { description: Transitioned programme, content: { application/json: { schema: { $ref: "#/components/schemas/Programme" } } } }
  /portal/programmes/{id}/audit:
    get:
      operationId: listProgrammeAuditEvents
      tags: [portal-programmes]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
      responses:
        "200":
          description: Programme audit events
          content:
            application/json: { schema: { $ref: "#/components/schemas/ProgrammeAuditEvents" } }
        "404": { $ref: "#/components/responses/NotFound" }
