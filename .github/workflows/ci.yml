name: Build and security regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hetv_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hetv_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Ephemeral isolated CI database only, never destination credentials.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hetv_ci
      EMAIL_WORKERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm build:render
      - run: pnpm check:render
      - run: pnpm test:render
      - run: pnpm --filter @workspace/api-server test
