# Preparation only. Applying this Blueprint creates billable resources.
# Review ownership, region, plans and costs before approving it in Render.
# Real Resend/authentication values are entered ONLY on the destination host.
services:
  - type: web
    name: hetv-opportunities
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    # Render's /usr/bin is read-only, so a plain `corepack enable` fails (EROFS).
    # Install the pinned pnpm shim into a writable project folder and put it first
    # on PATH so nested pnpm calls in build-render.mjs use the same version.
    buildCommand: mkdir -p .render-bin && corepack enable --install-directory "$PWD/.render-bin" pnpm && export PATH="$PWD/.render-bin:$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 && pnpm install --frozen-lockfile --prod=false && pnpm build:render
    # Same as `pnpm start`, without needing pnpm at runtime.
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PNPM_VERSION
        value: 10.26.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hetv-postgres
          property: connectionString
      - key: SERVE_STATIC_APPS
        value: "true"
      - key: EMAIL_WORKERS_ENABLED
        value: "false"
      - key: PUBLICATION_EMAIL_MODE
        value: "off"
      - key: PUBLICATION_EMAIL_APPROVED
        value: "false"
databases:
  - name: hetv-postgres
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
